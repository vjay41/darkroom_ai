# What darkroom_ai has been verified against. Data, not code: edit this file when a live check
# changes the picture. Untested or known-issue versions only WARN; nothing here refuses a call.
# A tool is blocked only when it actually fails (see `darkroom selftest` and get_capabilities).

[apps.lightroom]
baseline = "15.2.1"
tested = ["15.2"]            # major.minor prefixes verified live

[apps.photoshop]
baseline = "27.8"
tested = ["27.8"]

[plugin]
min_version = "0.10.0"       # older plug-ins lack commands the tools rely on

# status: verified | known_issue | untested | unavailable
# verified_on: the Adobe version the live check ran on.

[[features]]
name = "Read photo, EXIF, lens and catalog facts"
tools = ["get_photo_info", "get_photo_metadata", "list_catalog_photos", "catalog_summary", "find_photo", "get_selected_photos"]
status = "verified"
verified_on = "Lightroom 15.2.1"

[[features]]
name = "Stack state (in a stack, collapsed) and early refusal of mask tools"
tools = ["get_photo_info", "create_mask"]
status = "verified"
verified_on = "Lightroom 15.2.1"
note = "Needs plug-in 0.9.4 or newer: older plug-ins cannot read stack state."

[[features]]
name = "Library state: star rating, pick/reject flag, keywords (virtual copies only) and undo"
tools = ["get_library_state", "set_library_state", "undo_library_change"]
status = "verified"
verified_on = "Lightroom 15.2.1"
note = "Needs plug-in 0.10.0 or newer. A keyword that does not exist is created at the top level of the keyword list and stays there after undo (the SDK cannot delete keywords). JPG checked live; other formats use the same calls."

[[features]]
name = "Tone curve (combined and red/green/blue), limited, measured, undoable"
tools = ["get_tone_curve", "adjust_tone_curve", "undo"]
status = "verified"
verified_on = "Lightroom 15.2.1"
note = "Curves are flat x,y lists on a 0-255 scale in ToneCurvePV2012 and its Red/Green/Blue variants. JPG checked live."

[[features]]
name = "Preview and numeric analysis"
tools = ["get_preview", "analyze_photo", "analyze_batch"]
status = "verified"
verified_on = "Lightroom 15.2.1"

[[features]]
name = "Develop sliders on JPG/TIFF (lighting, white balance, HSL, crop, any listed parameter)"
tools = ["adjust_lighting", "adjust_white_balance", "adjust_hsl", "crop", "set_develop_parameters", "undo"]
status = "verified"
verified_on = "Lightroom 15.2.1"
note = "White balance on JPG/TIFF uses the relative Incremental sliders."

[[features]]
name = "Develop sliders on RAW/DNG (incl. Kelvin white balance)"
tools = ["adjust_lighting", "adjust_white_balance"]
status = "verified"
verified_on = "Lightroom 15.2.1 (Sony ARW)"
note = "Exposure, tone and Kelvin white balance (5600 to 5800 K) were written to the virtual copy of two ARW files, read back and undone exactly; the master and file were unchanged. DNG was not tested."

[[features]]
name = "Whole-folder rehearsal (240 real photos in a separate catalog)"
tools = ["list_catalog_photos", "analyze_batch", "batch_set_develop_parameters", "batch_set_library_state", "undo_batch"]
status = "verified"
verified_on = "Lightroom 15.2.1 (236 JPG, 4 ARW)"
note = "A separate catalog holding D:\\Dhiva_23072023 by reference: every photo measured, filters matched the metadata, 10 develop and 10 library edits verified and undone, all files and masters unchanged. The owner's real catalog was not used."

[[features]]
name = "RAW develop writes on DNG files"
tools = ["adjust_lighting", "adjust_white_balance"]
status = "verified"
verified_on = "Lightroom 15.2.1 (DNG converted from Sony ARW)"
note = "Lighting, Kelvin white balance, lens toggles, library fields and undo passed live on a DNG made by Lightroom from an ARW (scripts/raw_live.py). Other DNG sources (for example phone or in-camera DNG) have not been run."

[[features]]
name = "Lens profile and chromatic aberration toggles"
tools = ["set_develop_parameters", "get_develop_parameters"]
status = "verified"
verified_on = "Lightroom 15.2.1 (JPG, Sony ARW, DNG)"
note = "The switches turn on and read back, and Lightroom reports the profile it found: for a Sony FE 24-70mm F2.8 GM II on an ILCE-7M5 it named an Adobe profile for that lens on both ARW and DNG. An earlier run on the portrait JPG showed an empty name (not re-run)."

[[features]]
name = "AI masks: subject, sky, background, objects, landscape"
tools = ["create_mask", "set_mask_adjustments", "invert_mask", "delete_mask"]
status = "verified"
verified_on = "Lightroom 15.2.1 (subject, sky)"

[[features]]
name = "Masks written as data: linear gradient, radial gradient, luminance range"
tools = ["create_mask"]
status = "verified"
verified_on = "Lightroom 15.2.1"

[[features]]
name = "People mask"
tools = ["create_mask"]
status = "verified"
verified_on = "Lightroom 15.2.1"
note = "Interactive: after the go-ahead the person picks someone in Lightroom (Select People) on the working copy shown in Develop and presses Create Mask within about a minute. Confirmed end to end 2026-11-21 with approvals set to manual."

[[features]]
name = "Colour range and depth range masks"
tools = ["create_mask"]
status = "unavailable"
note = "Lightroom's stored format for these has not been captured, so they cannot be created automatically yet."

[[features]]
name = "Presets"
tools = ["list_presets", "apply_preset"]
status = "verified"
verified_on = "Lightroom 15.2.1"

[[features]]
name = "Import a folder"
tools = ["scan_folder", "import_folder"]
status = "verified"
verified_on = "Lightroom 15.2.1"

[[features]]
name = "Photoshop hand-off (16-bit TIFF in, new PSD out)"
tools = ["replace_background"]
status = "verified"
verified_on = "Photoshop 27.8"
note = "The picture-background path (add image layer below) was not run live."

[[features]]
name = "Batch writes (develop and library) and undo_batch"
tools = ["batch_set_library_state", "batch_set_develop_parameters", "undo_batch"]
status = "verified"
verified_on = "Lightroom 15.2.1 (JPG and Sony ARW)"
note = "Plan, go-ahead, run, verified undo and untouched masters were confirmed live on three test photos, and once driven by Hermes itself (the model chose the values). Stopping at a failure part-way through and at the time budget were also run live on three real photos (`scripts/batch_failure_live.py`), with the failure and the clock staged by the script because Lightroom cannot be made to fail on demand: the first photo was edited, the failed or over-budget ones were reported and left alone, and undo_batch restored the first photo with read-back verified."

[[features]]
name = "Catalog list filters (rating, flag, keyword, file format, ISO, capture date)"
tools = ["list_catalog_photos"]
status = "verified"
verified_on = "Lightroom 15.2.1"
note = "Rating, flag and keyword need plug-in 0.11.0; file format, ISO and capture date need 0.12.0. An older plug-in is refused rather than returning an unfiltered list. There is no edited filter because Lightroom flags every virtual copy as edited."

[[features]]
name = "Catalog management (catalog overview, collections, keywords, owner allowlist, master metadata)"
tools = ["get_catalog_info", "list_catalogs", "request_catalog_access", "request_folder_access", "create_collection_set", "create_collection", "add_to_collection", "remove_from_collection", "get_collection_photos", "create_keyword", "undo_collection_change", "scan_folder", "import_folder", "set_library_state"]
status = "verified"
verified_on = "Lightroom 15.2.1 (plug-in 0.13.0, rehearsal catalog)"
note = "`scripts/catalog_live.py` ran 40+ checks live: a folder outside the allowed folders was refused, the owner prompt said No then Yes and the plug-in saw the new folder without a restart, scan flagged a same-name file, 4 photos were imported with files unchanged, collections and sets were made, filled, listed and undone, 12 photos needed a go-ahead, a keyword hierarchy was created, rating/flag/keyword were written to a MASTER and undone, and a catalog photo was edited and undone. Hermes also drove it. NOT verified: opening or creating a catalog (impossible from the plug-in, the owner does it), allowlisting a second real catalog, and imports cannot be undone by darkroom_ai."

[[features]]
name = "Noise and sharpness measurement + noise reduction / sharpening skills"
tools = ["analyze_photo", "analyze_batch", "set_develop_parameters", "create_mask", "set_mask_adjustments", "undo"]
status = "verified"
verified_on = "Lightroom 15.2.1 (plug-in 0.13.0, rehearsal catalog, high-ISO JPG)"
note = "`scripts/detail_live.py` ran live: colour noise reduction took chroma noise 0.494 -> 0.0, luminance smoothing lowered luma noise, sharpening kept or raised edge strength (0.2186 -> 0.2229), a luminance mask with local luminance noise lowered noise (0.373 -> 0.318), undo restored the baseline and the master never changed. Lightroom re-renders mask edits about 3 seconds late, so measure after waiting. Repeated on a RAW (ARW, ISO 1250): luma noise 0.494 -> 0.247 and edges kept; the local-mask effect cannot be measured there because the estimate is already at its floor (about 0.3), so only the stored mask value is checked. NOT verified: the noise numbers are estimates from flat areas, not lab measurements."

[[features]]
name = "Skin-tone measurement and correction (measure_region + lr-skin-tone) and S-curve"
tools = ["measure_region", "adjust_white_balance", "adjust_hsl", "create_mask", "set_mask_adjustments", "get_tone_curve", "adjust_tone_curve", "undo"]
status = "verified"
verified_on = "Lightroom 15.2.1 (plug-in 0.13.1, rehearsal catalog, one portrait JPG and one RAW)"
note = "`scripts/portrait_live.py` ran live on a JPG and an ARW: warmer white balance raised skin hue and moved a neutral patch, orange HSL saturation lowered skin chroma and orange luminance lightened it, a radial mask with a local temperature moved only the skin (the neutral patch did not move), an S-curve widened the tone spread (p95-p05 0.6815 -> 0.7254 on the JPG, 0.7490 -> 0.7958 on the RAW), and undo restored every value; masters never changed. Hermes also did both jobs on its own through the connector (skin: local mask, neutral patch bit-for-bit unchanged; RAW: luma noise halved, S-curve spread 0.7487 -> 0.7912, everything undone). Faces are NOT detected (no face model by design): the agent places the boxes from the preview. NOT verified: people masks for skin (need the person chosen in Lightroom), blemish retouching (out of scope)."

[[features]]
name = "Large-catalog reads (list_photos, catalog_info, scan_folder use batch metadata calls)"
tools = ["list_catalog_photos", "catalog_summary", "get_catalog_info", "scan_folder"]
status = "verified"
verified_on = "Lightroom 15.2.1 (plug-in 0.13.1, rehearsal catalog of 248 photos)"
note = "Found by the live run: with 248 photos a list call took 7 s and timed out at the client's 10 s. The plug-in now reads the needed fields for all photos in one batch call (0.1 s for 30 photos) and the client waits up to 60 s for catalog-wide reads. All filters (ISO, format, rating, flag, date, keyword, path) were re-run after the change. NOT verified: a catalog of tens of thousands of photos."

