# darkroom_ai configuration (checked in; no secrets, no personal paths).
# Put machine-specific overrides in darkroom.local.toml next to this file (git-ignored).
# Every address must be a loopback address (127.0.0.1, localhost, ::1); anything else is rejected.

[llm]
active_profile = "primary"
require_loaded = true       # never let a request load a model: refuse if it is not loaded already

# vision / tool_mode below are starting values and are UNVERIFIED until `darkroom models test` (phase 6).
[llm.profiles.primary]
base_url = "http://127.0.0.1:1234/v1"
model = "qwen/qwen3.8-27b"
vision = true
tool_mode = "native"        # native | json_schema | prompt
reasoning_effort_tools = "none"   # no thinking on tool follow-up turns (measured: about half the time)
# reasoning_effort_planning is not set: planning turns (new measurements) use the model's default thinking
temperature = 0.2
max_image_px = 1024
max_images = 2
timeout_s = 120

[llm.profiles.glimmer]
base_url = "http://127.0.0.1:1234/v1"
model = "meta/muse-glimmer"
vision = true
tool_mode = "json_schema"
temperature = 0.2
max_image_px = 1024
max_images = 2
timeout_s = 120

[llm.profiles.fast]
base_url = "http://127.0.0.1:1234/v1"
model = "google/gemma-4-e4b"
vision = true
tool_mode = "json_schema"
temperature = 0.2
max_image_px = 768
max_images = 1
timeout_s = 60

[lightroom]
host = "127.0.0.1"
timeout_s = 10
# test_catalog = "D:/path/to/test_catalog/Test.lrcat"   # set in darkroom.local.toml

[photoshop]
prog_id = "Photoshop.Application"
timeout_s = 30
auto_start = true           # launch Photoshop when it is not running
start_timeout_s = 120       # longest wait for Photoshop to launch
ready_grace_s = 30          # on screen but silent this long -> error (start/sign-in screen)

[guardrails]
max_passes = 3
# Per-pass limits bound one edit; totals bound the change against the photo's original values.
# Values beyond a limit are clamped and reported (requested vs applied).
exposure_ev_per_pass = 1.5
exposure_ev_total = 3.0     # going beyond needs an explicit confirmation
tone_per_pass = 50          # contrast, highlights, shadows, whites, blacks
wb_relative_per_pass = 30   # JPG/TIFF: Lightroom's relative -100..100 temperature/tint sliders
wb_kelvin_per_pass = 1000   # RAW: Kelvin (untested)
wb_tint_raw_per_pass = 30   # RAW (untested)
hsl_per_pass = 30
min_crop_fraction = 0.25

[backgrounds]
dir = "backgrounds"         # replace_background only uses pictures from this folder
max_file_mb = 50

[masks]
backend = "photoshop"       # photoshop (Select Subject on the device) | onnx | synthetic (tests only)
# onnx_model = "D:/models/your_mask_model.onnx"   # only for backend = "onnx"; never downloaded
gpu_index = 1               # GPU for the ONNX model (the RTX 3090)
allow_cpu = false           # false: fail instead of silently running on the CPU
onnx_input_width = 1024
onnx_input_height = 1024

[faces]
# model = "D:/models/face_detection_yunet.onnx"   # without it face analysis returns FACE_MODEL_MISSING
score_threshold = 0.7

[gpu]
min_free_mb = 3000          # doctor warns if a GPU that Photoshop uses has less free memory than this

[paths]
logs_dir = "logs"
outputs_dir = "outputs"
previews_dir = "previews"
models_dir = "models"
