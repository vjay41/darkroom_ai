[lightroom]
host = "127.0.0.1"
timeout_s = 10
# test_catalog = "D:/path/to/test_catalog/Test.lrcat"   # set in darkroom.local.toml

[photoshop]
prog_id = "Photoshop.Application"
timeout_s = 30
auto_start = true           # launch Photoshop when it is not running
start_timeout_s = 120       # longest wait for Photoshop to launch
ready_grace_s = 30          # on screen but silent this long -> error (start/sign-in screen)

[guardrails]
max_passes = 3
# Per-pass limits bound one edit; totals bound the change against the photo's original values.
# Values beyond a limit are clamped and reported (requested vs applied).
exposure_ev_per_pass = 1.5
exposure_ev_total = 3.0     # going beyond needs an explicit confirmation
tone_per_pass = 50          # contrast, highlights, shadows, whites, blacks
wb_relative_per_pass = 30   # JPG/TIFF: Lightroom's relative -100..100 temperature/tint sliders
wb_relative_total = 60      # JPG/TIFF: total against the original; beyond needs a confirmation
wb_kelvin_per_pass = 1000   # RAW: Kelvin
wb_kelvin_total = 2000      # RAW: total against the original; beyond needs a confirmation
wb_tint_raw_per_pass = 30   # RAW
wb_tint_raw_total = 40      # RAW: total against the original; beyond needs a confirmation
hsl_per_pass = 30
curve_per_pass = 32           # tone curve points (0..255 scale): most one pass may move a point
curve_total = 64              # most a point may be from a straight line
min_crop_fraction = 0.25

[backgrounds]
dir = "backgrounds"         # replace_background only uses pictures from this folder
max_file_mb = 50

[masks]
backend = "photoshop"       # photoshop (Select Subject on the device) | onnx | synthetic (tests only)
# onnx_model = "D:/models/your_mask_model.onnx"   # only for backend = "onnx"; never downloaded
gpu_index = 1               # GPU for the ONNX model (the RTX 3090)
allow_cpu = false           # false: fail instead of silently running on the CPU
onnx_input_width = 1024
onnx_input_height = 1024

[faces]
# model = "D:/models/face_detection_yunet.onnx"   # optional: faces are normally left to Lightroom (people/subject masks)
score_threshold = 0.7
[gpu]
min_free_mb = 3000          # doctor warns if a GPU that Photoshop uses has less free memory than this

[paths]
logs_dir = "logs"
outputs_dir = "outputs"
previews_dir = "previews"
models_dir = "models"
